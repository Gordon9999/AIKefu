<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIKefu · 目录导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .report-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .report-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }
        .report-header .subtitle {
            font-size: 0.9rem;
            color: #64748b;
        }
        .report-header .meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.4rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 2rem;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.15s;
        }
        .card:hover { border-color: #2563eb; }
        .card a {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .card a:hover { text-decoration: underline; }
        .card .icon { margin-right: 0.4rem; }
        .badge {
            flex-shrink: 0;
            display: inline-block;
            padding: 0.1rem 0.5rem;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 4px;
            background: #dcfce7;
            color: #16a34a;
            white-space: nowrap;
        }

        .file-list { padding-left: 0.2rem; }
        .file-list .card { padding: 0.6rem 1rem; }

        .status {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
            font-size: 0.95rem;
        }
        .status .spinner {
            display: inline-block;
            width: 1.2rem; height: 1.2rem;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #dc2626; }

        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .container { padding: 1.5rem 1rem 3rem; }
            .report-header h1 { font-size: 1.3rem; }
            .card { padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="report-header">
        <h1>📚 AIKefu · 目录导航</h1>
        <div class="subtitle">仓库内容自动索引，由 GitHub API 实时拉取</div>
        <div class="meta">子目录含 index 页面时，仅展示该目录（指向其主页）</div>
    </div>

    <div id="content">
        <div class="status"><div class="spinner"></div><div>正在加载目录…</div></div>
    </div>

    <div class="footer">
        Generated by AIKefu Index · <span id="footer-date"></span>
    </div>

</div>

<script>
(function () {
    const REPO = "Gordon9999/AIKefu";
    const BRANCH = "main";
    const BASE = "https://gordon9999.github.io/AIKefu/";

    function esc(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
    }

    function dirLabel(dir) {
        // 去掉多层目录的中间层，只保留最后一段做显示名；路径本身用于链接
        const parts = dir.split("/").filter(Boolean);
        return parts[parts.length - 1];
    }

    function renderRootFiles(files) {
        if (!files.length) return "";
        let html = '<div class="section-title">📄 根目录页面</div>';
        for (const p of files) {
            html += `<div class="card file-list"><span><span class="icon">📄</span><a href="${esc(BASE + encodeURIComponent(p))}" target="_blank">${esc(p)}</a></span></div>`;
        }
        return html;
    }

    function renderDirs(dirs) {
        if (!dirs.length) return "";
        let html = '<div class="section-title">📁 子目录</div>';
        for (const d of dirs) {
            const label = dirLabel(d.dir);
            if (d.hasIndex) {
                const href = BASE + d.dir.replace(/\/$/, "") + "/index.html";
                html += `<div class="card"><span><span class="icon">📁</span><a href="${esc(href)}" target="_blank">${esc(label)}</a></span><span class="badge">主页</span></div>`;
            } else {
                html += `<div class="card"><span><span class="icon">📁</span><a href="${esc(BASE + d.dir)}" target="_blank">${esc(label)}</a></span></div>`;
                for (const f of d.files) {
                    const href = BASE + d.dir + encodeURIComponent(f);
                    html += `<div class="card file-list"><span><span class="icon">📄</span><a href="${esc(href)}" target="_blank">${esc(label + " / " + f)}</a></span></div>`;
                }
            }
        }
        return html;
    }

    async function load() {
        const el = document.getElementById("content");
        try {
            const res = await fetch(
                `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`,
                { headers: { "Accept": "application/vnd.github+json" } }
            );
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            const htmlFiles = (data.tree || [])
                .filter(t => t.type === "blob" && t.path.toLowerCase().endsWith(".html"));

            const rootFiles = [];
            const dirMap = new Map(); // dir -> {dir, hasIndex, files:[]}
            for (const f of htmlFiles) {
                const idx = f.path.indexOf("/");
                if (idx === -1) {
                    if (f.path !== "index.html") rootFiles.push(f.path);
                    continue;
                }
                const dir = f.path.slice(0, idx + 1); // keep trailing slash
                const name = f.path.slice(idx + 1);
                if (!dirMap.has(dir)) dirMap.set(dir, { dir, hasIndex: false, files: [] });
                const d = dirMap.get(dir);
                if (name.toLowerCase() === "index.html") d.hasIndex = true;
                else d.files.push(name);
            }
            rootFiles.sort((a, b) => a.localeCompare(b, "zh"));
            const dirs = [...dirMap.values()].sort((a, b) => a.dir.localeCompare(b.dir, "zh"));
            for (const d of dirs) d.files.sort((a, b) => a.localeCompare(b, "zh"));

            const html =
                renderRootFiles(rootFiles) +
                renderDirs(dirs) +
                (rootFiles.length || dirs.length ? "" : '<div class="status">暂无页面</div>');
            el.innerHTML = html;
        } catch (e) {
            el.innerHTML = `<div class="status error">加载失败：${esc(e.message)}<br>请刷新重试，或稍后再访问（GitHub API 免费限额 60 次/小时）</div>`;
        }
    }

    document.getElementById("footer-date").textContent = new Date().toISOString().slice(0, 10);
    load();
})();
</script>
</body>
</html>
